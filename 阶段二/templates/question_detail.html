{% extends 'base.html' %}{% block content %}
<section class="content"><div class="page-heading"><div><a href="/library" class="text-link">← 返回题目库</a><h1 id="question-title">题目详情</h1><p id="question-meta" class="muted">正在读取题目…</p></div><a id="question-stats-link" class="button secondary">使用与统计 ↗</a></div>
<div id="question-error" hidden></div><div id="question-workspace" hidden><div class="editor-grid"><div>
<section class="panel"><div class="section-title"><h2>版本内容</h2><span id="current-version" class="badge"></span></div><label>查看版本<select id="version-select"></select></label><div id="version-preview"></div><div class="actions wrap"><button id="new-version" class="button" hidden>基于此版本修改</button><button id="restore-version" class="button secondary" hidden>恢复为新版本</button><button id="select-current" class="button secondary" hidden>设为推荐版本</button></div><p class="hint">恢复会创建新版本。切换推荐版本不会更新已有问卷。</p></section>
<section id="history-panel" class="panel" hidden><h2>版本历史</h2><div id="version-history"></div><button id="versions-more" class="button secondary" hidden>更早版本</button><details><summary>比较两个版本</summary><form id="diff-form"><div class="two-cols"><label>原版本<select name="from"></select></label><label>新版本<select name="to"></select></label></div><button class="button secondary" type="submit">比较差异</button></form><div id="version-diff" aria-live="polite"></div></details></section>
<section id="sharing-panel" class="panel" hidden><h2>指定用户共享</h2><p class="muted">接收者可以选用题目；共享不授予版本管理或他人回答的访问权。</p><form id="share-form"><label>接收者的准确用户名<input name="recipientUsername" required maxlength="30"></label><button class="button secondary" type="submit">共享题目</button></form><div id="share-history"></div><button id="shares-more" class="button secondary" hidden>更多授权记录</button></section>
</div><aside class="editor-side"><section class="panel"><h2>使用这个版本</h2><form id="import-form"><label>加入本人草稿问卷<select name="surveyId" required></select></label><button type="submit" class="button wide">加入问卷</button></form><form id="add-bank-form"><label>收藏到题库<select name="bankId" required></select></label><button type="submit" class="button secondary wide">加入题库</button></form><p class="hint">选用当前查看的确定版本；同题可在一份问卷中出现多次。</p><button id="copy-question" class="button secondary wide">创建独立副本</button><p class="hint">副本归你所有，可以独立修改和统计。</p></section></aside></div></div></section>
<dialog id="content-dialog" class="large-dialog"><form id="content-form"><h2 id="content-heading">创建新版本</h2>{% include '_content_form.html' %}<label>修改说明<textarea name="changeNote" rows="2" maxlength="5000"></textarea></label><div class="actions"><button class="button" type="submit">保存新版本</button><button type="button" class="button secondary" data-close-dialog>取消</button></div></form></dialog>
{% endblock %}
