{% extends 'base.html' %}{% block content %}
<section class="content"><div class="page-heading"><div><span class="eyebrow">按用途，整理你的好问题</span><h1>我的题库<span class="accent">。</span></h1><p class="muted">题库属于你自己。条目绑定默认版本，不会改变已有问卷。</p></div><button id="create-bank" class="button">＋ 新建题库</button></div>
<div class="bank-layout"><section class="panel"><h2>题库列表</h2><div id="bank-list"></div><button id="banks-more" class="button secondary" hidden>更多题库</button></section><section class="panel"><div id="bank-empty" class="muted">选择一个题库查看条目。</div><div id="bank-detail" hidden><div class="section-title"><h2 id="bank-name"></h2><div class="actions"><button id="edit-bank" class="button secondary small">编辑</button><button id="delete-bank" class="button danger small">删除</button></div></div><p id="bank-description" class="muted"></p><p class="hint">从「题目库」的题目详情页可将指定版本加入本题库。</p><div id="bank-items"></div><button id="items-more" class="button secondary" hidden>更多条目</button></div></section></div></section>
<dialog id="bank-dialog"><form id="bank-form"><h2 id="bank-form-title">新建题库</h2><label>名称<input name="name" required maxlength="200"></label><label>说明<textarea name="description" rows="3" maxlength="5000"></textarea></label><div class="actions"><button class="button" type="submit">保存题库</button><button class="button secondary" type="button" data-close-dialog>取消</button></div></form></dialog>
<dialog id="item-dialog"><form id="item-form"><h2>调整默认版本</h2><p class="hint">只影响未来选题；当前问卷不会自动更新。</p><label>可选版本<select name="versionId" required></select></label><div class="actions"><button class="button" type="submit">保存默认版本</button><button class="button secondary" type="button" data-close-dialog>取消</button></div></form></dialog>
{% endblock %}
