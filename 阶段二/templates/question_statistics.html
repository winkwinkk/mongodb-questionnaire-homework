{% extends 'base.html' %}{% block content %}
<section class="content"><div class="page-heading"><div><a id="back-question" class="text-link">← 题目详情</a><h1>跨问卷统计<span class="accent">。</span></h1><p class="muted">只包含本人问卷。匿名和重复提交无法可靠去重，不报告独立人数。</p></div><button id="refresh-question-stats" class="button secondary">刷新统计</button></div>
<form id="question-stats-filter" class="panel"><div class="two-cols"><label>版本范围<select name="versionId"><option value="">全部可见版本</option></select></label><label>数字分布边界<input name="bins" placeholder="例如：0, 18, 30, 60, 120"></label></div><button type="submit" class="button secondary">应用筛选</button></form>
<div id="question-stat-counts" class="metrics"></div><p id="question-stat-note" class="hint"></p>
<section class="panel"><h2>整体汇总 · 按兼容组</h2><p class="hint">未经所有者确认的版本独立展示，平均值与分布分别判断兼容性。</p><div id="overall-statistics"></div></section>
<section class="panel"><h2>版本明细</h2><div id="version-statistics"></div></section>
<section class="panel"><h2>本人问卷中的使用关系</h2><div id="question-usage"></div><button id="usage-more" class="button secondary" hidden>更多使用记录</button></section>
<section id="compatibility-panel" class="panel" hidden><h2>统计兼容性管理</h2><p class="muted">仅题目所有者可确认。系统检查结构并提示变化，含义是否一致需要你核实。</p><form id="compatibility-form"><label>统计指标<select name="metric"><option value="numericMean">数字平均值</option><option value="numericDistribution">数字分布</option><option value="choiceDistribution">选项分布</option><option value="textResponses">文本回答数量</option></select></label><label>分组名称<input name="groupId" required maxlength="100" placeholder="例如：周岁年龄"></label><fieldset><legend>参与版本（至少两个）</legend><div id="compatible-versions" class="version-checks"></div></fieldset><button type="submit" class="button secondary">检查并加入待确认配置</button></form>
<div id="compatibility-preview"></div><h3>待确认的完整配置</h3><p class="hint">移除分组只影响对应指标，版本会恢复独立统计；保存时替换完整配置。</p><div id="compatibility-groups"></div><form id="confirm-compatibility-form"><label>确认依据<textarea name="reason" rows="2" required maxlength="2000" placeholder="请说明单位、范围、选项或含义为何兼容"></textarea></label><label class="inline-check"><input name="confirmed" type="checkbox" required>我已核实这些版本在对应指标上的含义一致</label><div class="actions wrap"><button type="submit" class="button">确认并保存配置</button><button id="reset-compatibility" type="button" class="button secondary">全部恢复独立统计</button></div></form><details><summary>配置确认历史</summary><div id="compatibility-history"></div></details></section></section>
{% endblock %}
