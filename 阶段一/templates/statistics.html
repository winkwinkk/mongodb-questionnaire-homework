{% extends 'base.html' %}{% block content %}
<section class="content"><div class="page-heading"><div><span class="eyebrow">让反馈，成为下一步的依据</span><h1 id="stats-title">问卷统计<span class="accent">。</span></h1><p class="muted">数据来自已成功提交的回答，跳过的题目不计为已答。</p></div><div class="actions"><a id="back-editor" class="button secondary">问卷配置</a><button id="refresh-stats" class="button">刷新结果 ↻</button></div></div><div class="metrics"><div><span class="metric-label">累计回答</span><strong id="response-count">—</strong><small>成功保存的提交记录</small></div><div><span class="metric-label">问卷题数</span><strong id="stats-question-count">—</strong><small>每道题单独统计</small></div><div><span class="metric-label">当前查看</span><strong id="stats-scope" class="metric-text">全部题目</strong><small id="stats-time">—</small></div></div><div class="list-toolbar"><h2>逐题结果</h2><select id="question-filter" aria-label="选择统计题目"><option value="all">全部题目</option></select></div><div id="statistics-list"><p class="muted">正在整理回答…</p></div></section>
{% endblock %}
